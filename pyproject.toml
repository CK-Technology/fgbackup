[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fgbackup"
version = "0.1.0"
description = "Back up FortiGate configs from a FortiCloud portal to Wasabi via restic"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CK-Technology" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
fgbackup = "fgbackup.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fgbackup"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
